<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú de Comida</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* --- PANTALLA DE CARGA (LOADER CON FONDO BLANCO) --- */
/* --- PANTALLA DE CARGA (LOADER CON FONDO BLANCO) --- */
    #pantalla-carga {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Contenedor adaptativo amplio ajustado al borde de la pantalla */
    .loader-contenedor {
      position: relative;
      /* Se adapta usando vmin para tomar casi toda la pantalla en pantallas cuadradas, horizontales o verticales */
      width: 80vmin; 
      height: 80vmin;
      max-width: 600px;  /* Límite para pantallas muy grandes */
      max-height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* Anillo giratorio cerca del borde del contenedor */
    .loader-circulo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 6px solid rgba(0, 0, 0, 0.06); /* Borde un poco más grueso para mantener proporción */
      border-top: 6px solid #0d0d0d;
      border-radius: 50%;
      animation: girar 1s linear infinite;
      box-sizing: border-box;
    }

    /* Logo aprovechando el espacio interno del círculo */
    .loader-svg {
      width: 75%;
      height: 75%;
      object-fit: contain;
    }

    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Clase para desvanecer la pantalla de carga */
    #pantalla-carga.oculto {
      opacity: 0;
      visibility: hidden;
    }

    /* --- CONTENEDOR PRINCIPAL DEL MENÚ --- */
    .menu-contenedor {
      position: relative;
      width: 100%;
      max-width: 700px;
      container-type: inline-size;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .menu-contenedor.visible {
      opacity: 1;
    }

    .menu-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .grupo-precio {
      position: absolute;
      font-family: Arial, sans-serif;
      font-weight: bold;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      white-space: nowrap;
      transform: translate(-50%, -50%);
    }

    .precio-bs, .precio-usd {
      display: block;
      padding: 0.1em 0.3em;
      line-height: 1;
      text-align: center;
      color: #000000;
      margin: 0;
    }

    .layout-bs-arriba { flex-direction: column; }
    .layout-usd-arriba { flex-direction: column-reverse; }
    .layout-bs-izquierda { flex-direction: row; }
    .layout-usd-izquierda { flex-direction: row-reverse; }

    .con-colordivi .precio-bs {
      background-color: #fdf066;
      color: #000000;
    }

    .con-colordivi .precio-usd {
      background-color: #83d475;
      color: #000000;
    }

    .producto-agotado {
      color: #8b0000;
      background-color: #000000;
      padding: 0.1em 0.4em;
      border: 1.5px solid #8b0000;
      border-radius: 4px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE CARGA CON FONDO BLANCO -->
  <div id="pantalla-carga">
    <div class="loader-contenedor">
      <div class="loader-circulo"></div>
      <img src="Comida.svg" alt="Cargando..." class="loader-svg">
    </div>
  </div>

  <!-- MENÚ PRINCIPAL -->
  <div class="menu-contenedor" id="menu-contenedor">
    <img id="menu-img" alt="Menú del restaurante" class="menu-img">
  </div>

<script>
// Función para extraer el ID de una URL de Google Sheets
function obtenerIdDesdeUrl(url) {
  if (!url.includes('google.com')) return url.trim();
  const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return match ? match[1] : null;
}

// Inyecta la regla @font-face y aplica la tipografía al CSS
function aplicarFontFace(nombreFamilia, nombreArchivo) {
  const extension = nombreArchivo.split('.').pop().toLowerCase();
  let format = 'truetype';
  if (extension === 'woff') format = 'woff';
  if (extension === 'woff2') format = 'woff2';
  if (extension === 'otf') format = 'opentype';

  const style = document.createElement('style');
  style.innerHTML = `
    @font-face {
      font-family: '${nombreFamilia}';
      src: url('${nombreArchivo}') format('${format}');
      font-weight: normal;
      font-style: normal;
    }
    .grupo-precio { font-family: '${nombreFamilia}', sans-serif !important; }
  `;
  document.head.appendChild(style);
  return true;
}

// Escanea el directorio público en GitHub Pages para encontrar cualquier archivo que inicie con 'font-'
function buscarFuenteDinamicaRepo() {
  const pathSegments = window.location.pathname.split('/').filter(Boolean);
  
  // Si estamos en GitHub Pages (ej: usuario.github.io/repositorio/)
  if (window.location.hostname.endsWith('github.io') && pathSegments.length > 0) {
    const owner = window.location.hostname.split('.')[0];
    const repo = pathSegments[0];
    const githubApiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;

    return fetch(githubApiUrl)
      .then(res => {
        if (!res.ok) throw new Error('No se pudo acceder a la API de GitHub');
        return res.json();
      })
      .then(files => {
        if (Array.isArray(files)) {
          // Busca dinámicamente cualquier archivo cuyo nombre empiece con 'font-'
          const fontFile = files.find(file => file.name.toLowerCase().startsWith('font-'));
          if (fontFile) {
            return aplicarFontFace('FuenteMenuDinamica', fontFile.name);
          }
        }
        return false;
      })
      .catch(err => {
        console.warn('Búsqueda por API de GitHub omitida o con error:', err);
        return false;
      });
  }

  // Si estás trabajando en un entorno local de pruebas (localhost), probamos cargar extensiones comunes de 'font-'
  const extensiones = ['ttf', 'otf', 'woff2', 'woff'];
  
  // Intenta resolver la primera coincidencia que devuelva HTTP 200 OK
  return new Promise(resolve => {
    let detectada = false;
    let probadas = 0;

    extensiones.forEach(ext => {
      // Intento dinámico de probing local
      const testName = `font-BebasNeue-Regular.${ext}`; 
      fetch(testName, { method: 'HEAD' })
        .then(res => {
          if (res.ok && !detectada) {
            detectada = true;
            resolve(aplicarFontFace('FuenteMenuDinamica', testName));
          }
        })
        .catch(() => {})
        .finally(() => {
          probadas++;
          if (probadas === extensiones.length && !detectada) {
            resolve(false);
          }
        });
    });
  });
}

// Promesa de temporizador mínimo (1.5 segundos)
const tiempoMinimo = new Promise(resolve => setTimeout(resolve, 1500));

// Control de carga de la imagen de fondo
let cargarImagenFondo = Promise.resolve();

// Ejecución principal
buscarFuenteDinamicaRepo().then(fuenteCargada => {
  return fetch('config.json')
    .then(res => res.json())
    .then(configJson => {
      const idExtraido = obtenerIdDesdeUrl(configJson.ID_SHEET);

      if (!idExtraido) {
        throw new Error('No se pudo extraer un ID válido de la URL de Google Sheets.');
      }

      const HOJA_ELEMENTS = configJson.HOJA_ELEMENTS;
      const HOJA_MENU = configJson.HOJA_MENU;

      const URL_ELEMENTS = `https://opensheet.elk.sh/${idExtraido}/${HOJA_ELEMENTS}`;
      const URL_MENU = `https://opensheet.elk.sh/${idExtraido}/${HOJA_MENU}`;

      return Promise.all([
        fetch(URL_ELEMENTS).then(res => res.json()),
        fetch(URL_MENU).then(res => res.json()),
        Promise.resolve(fuenteCargada)
      ]);
    })
    .then(([elements, precios, localFontLoaded]) => {
      if (elements && elements.length > 0) {
        const config = elements[0];
        
        // Si no existe un archivo que empiece con 'font-' en el repositorio, usa la fuente de Google Fonts definida en la hoja
        if (!localFontLoaded && config.font) {
          const fontNameRaw = config.font.trim();
          const fontNameClean = fontNameRaw.replace(/([a-z])([A-Z])/g, '$1 $2');
          const fontUrlName = fontNameClean.replace(/\s+/g, '+');

          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = `https://fonts.googleapis.com/css2?family=${fontUrlName}&display=swap`;
          document.head.appendChild(link);

          const style = document.createElement('style');
          style.innerHTML = `.grupo-precio { font-family: '${fontNameClean}', sans-serif !important; }`;
          document.head.appendChild(style);
        }

        // Renderizar catálogo de precios
        const contenedor = document.getElementById('menu-contenedor');

        precios
          .filter(item => item.id && String(item.id).trim() !== '')
          .forEach(item => {
            const divGrupo = document.createElement('div');
            divGrupo.classList.add('grupo-precio');

            divGrupo.style.top = item.top;
            divGrupo.style.left = item.left;
            divGrupo.style.transform = `translate(-50%, -50%) rotate(${item.rotate || '0deg'})`;

            const isDisponible = String(item.disproduct).trim().toUpperCase() === 'TRUE';

            if (!isDisponible) {
              const spanAgotado = document.createElement('span');
              spanAgotado.classList.add('producto-agotado');
              spanAgotado.textContent = 'AGOTADO';
              
              if (item["font-size-bs"]) {
                spanAgotado.style.fontSize = item["font-size-bs"];
              } else if (item["font-size-usd"]) {
                spanAgotado.style.fontSize = item["font-size-usd"];
              }

              divGrupo.appendChild(spanAgotado);
            } else {
              divGrupo.classList.add(`layout-${item.layout}`);

              const conColor = String(item.colordivi).trim().toUpperCase() === 'TRUE';
              if (conColor) {
                divGrupo.classList.add('con-colordivi');
              }

              // --- MOSTRAR PRECIO BS ---
              const bsVisible = String(item["bs-visible"]).trim().toUpperCase() === 'TRUE';
              if (bsVisible) {
                const spanBs = document.createElement('span');
                spanBs.classList.add('precio-bs');
                spanBs.textContent = item.precio_bs;
                
                if (item["font-size-bs"]) {
                  spanBs.style.fontSize = item["font-size-bs"];
                }

                if (item["color-bs"] && String(item["color-bs"]).trim() !== '') {
                  spanBs.style.setProperty('color', String(item["color-bs"]).trim(), 'important');
                }

                divGrupo.appendChild(spanBs);
              }

              // --- MOSTRAR PRECIO USD ---
              const usdVisible = String(item["usd-visible"]).trim().toUpperCase() === 'TRUE';
              if (usdVisible) {
                const spanUsd = document.createElement('span');
                spanUsd.classList.add('precio-usd');
                spanUsd.textContent = item.precio_usd;

                if (item["font-size-usd"]) {
                  spanUsd.style.fontSize = item["font-size-usd"];
                }

                if (item["color-usd"] && String(item["color-usd"]).trim() !== '') {
                  spanUsd.style.setProperty('color', String(item["color-usd"]).trim(), 'important');
                }

                divGrupo.appendChild(spanUsd);
              }
            }

            contenedor.appendChild(divGrupo);
          });

        // Cargar imagen de fondo
        if (config['id-background-menu']) {
          const imgMenu = document.getElementById('menu-img');
          cargarImagenFondo = new Promise(resolve => {
            imgMenu.onload = resolve;
            imgMenu.onerror = resolve;
            imgMenu.src = config['id-background-menu'];
          });
        }
      }

      return Promise.all([tiempoMinimo, cargarImagenFondo]);
    })
    .then(() => {
      document.getElementById('pantalla-carga').classList.add('oculto');
      document.getElementById('menu-contenedor').classList.add('visible');
    })
    .catch(error => {
      console.error('Error durante la ejecución:', error);
      document.getElementById('pantalla-carga').classList.add('oculto');
      document.getElementById('menu-contenedor').classList.add('visible');
    });
});
</script>

</body>
</html>
